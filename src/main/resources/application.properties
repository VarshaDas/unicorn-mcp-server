spring.application.name=unicorn-mcp-server
server.port=8083

# MCP Server
spring.ai.mcp.server.name=unicorn-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# H2 Database for bookings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# OAuth2 removed — open access for demo
# Add spring-boot-starter-oauth2-authorization-server + OAuth2Config back when adding auth layer

# 1. JSON-RPC message exchange (every request/response between client and server)
logging.level.io.modelcontextprotocol=DEBUG

# 2. Spring AI MCP server internals (tool registration, tool dispatch, capability negotiation)
logging.level.org.springframework.ai.mcp=DEBUG

# 3. Tool execution workflow (which tool was called, with what args, what it returned)
logging.level.org.springframework.ai.tool=DEBUG

# 4. HTTP transport layer (Streamable HTTP request/response lifecycle)
logging.level.org.springframework.ai.mcp.server.transport=DEBUG
