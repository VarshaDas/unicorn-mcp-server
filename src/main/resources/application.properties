spring.application.name=unicorn-mcp-server
server.port=8083

# MCP Server
spring.ai.mcp.server.name=unicorn-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# H2 Database for bookings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# OAuth2 removed — open access for demo
# Add spring-boot-starter-oauth2-authorization-server + OAuth2Config back when adding auth layer
